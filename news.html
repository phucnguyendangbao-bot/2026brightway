<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tin tức hướng nghiệp – BrightWay Career</title>
<meta name="description" content="Tin tức, bài viết chia sẻ về nghề nghiệp, ngành học và tư vấn hướng nghiệp cho học sinh THPT." />
<link rel="icon" type="image/png" href="images/img-a84652d05567.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg: linear-gradient(145deg, #e8eeff 0%, #dde8ff 20%, #e5deff 50%, #d6e9ff 80%, #e0f0ff 100%);
  --glass: rgba(255,255,255,0.62);
  --glass-border: rgba(255,255,255,0.85);
  --grad: linear-gradient(135deg,#5b7cfa 0%,#7c5bf5 50%,#9f5bea 100%);
  --text-dark: #1a1a3e;
  --text-mid: #3a3a6e;
  --text-soft: #6b7aaa;
  --accent: #6366f1;
  --white: #ffffff;
  --shadow: 0 8px 32px rgba(99,102,241,0.15);
  --font: 'Be Vietnam Pro', system-ui, sans-serif;
  --font-display: 'Nunito', sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text-dark);min-height:100vh;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:14px 24px;}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:24px;}
.nav-brand{font-family:var(--font-display);font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:20px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.nav-links a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--text-mid);transition:0.2s;}
.nav-links a:hover{background:rgba(99,102,241,0.1);color:var(--accent);}
.nav-links a.active{background:var(--grad);color:#fff;}

/* HERO */
.hero{max-width:1200px;margin:0 auto;padding:48px 24px 24px;}
.hero h1{font-family:var(--font-display);font-size:36px;font-weight:900;margin-bottom:8px;}
.hero p{color:var(--text-soft);font-size:16px;}

/* CATEGORY PILLS */
.pills{max-width:1200px;margin:0 auto;padding:0 24px 24px;display:flex;gap:10px;flex-wrap:wrap;}
.pill{padding:8px 16px;border-radius:99px;background:var(--white);border:1px solid var(--glass-border);color:var(--text-mid);font-weight:600;font-size:14px;cursor:pointer;transition:0.2s;}
.pill:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.pill.active{background:var(--grad);color:#fff;border-color:transparent;}

/* SEARCH */
.search-box{max-width:1200px;margin:0 auto;padding:0 24px 24px;}
.search-box input{width:100%;padding:14px 20px;border-radius:14px;border:1px solid var(--glass-border);background:var(--white);font-size:15px;font-family:var(--font);outline:none;transition:0.2s;}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,0.1);}

/* GRID */
.grid{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}
.card{background:var(--white);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:0.3s;cursor:pointer;border:1px solid var(--glass-border);}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(99,102,241,0.2);}
.card-cover{aspect-ratio:16/9;background:linear-gradient(135deg,#c7d2fe,#e0e7ff);overflow:hidden;position:relative;}
.card-cover img{width:100%;height:100%;object-fit:cover;}
.card-cover .badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,0.95);color:var(--accent);font-size:12px;font-weight:700;}
.card-body{padding:20px;}
.card-meta{display:flex;gap:8px;align-items:center;color:var(--text-soft);font-size:13px;margin-bottom:10px;}
.card-title{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.3;margin-bottom:8px;color:var(--text-dark);}
.card-summary{color:var(--text-soft);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

/* STATES */
.state{max-width:1200px;margin:0 auto;padding:80px 24px;text-align:center;}
.state .icon{font-size:64px;margin-bottom:16px;}
.state h2{font-family:var(--font-display);font-size:24px;margin-bottom:8px;}
.state p{color:var(--text-soft);margin-bottom:24px;}
.spinner{display:inline-block;width:40px;height:40px;border:4px solid rgba(99,102,241,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  .nav-links{font-size:14px;}
  .hero h1{font-size:26px;}
  .hero{padding:32px 20px 16px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">BrightWay Career</a>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="news.html" class="active">Tin tức</a>
      <a href="majors.html">Ngành nghề</a>
      <a href="holland.html">Trắc nghiệm</a>
      <a href="login.html" id="nav-auth">Đăng nhập</a>
    </div>
  </div>
</nav>

<section class="hero">
  <h1>Tin tức hướng nghiệp</h1>
  <p>Chia sẻ kiến thức, kinh nghiệm nghề nghiệp từ thầy cô và chuyên gia</p>
</section>

<div class="pills" id="pills">
  <button class="pill active" data-cat="">Tất cả</button>
  <button class="pill" data-cat="chia_se">Chia sẻ</button>
  <button class="pill" data-cat="tu_van">Tư vấn</button>
  <button class="pill" data-cat="su_kien">Sự kiện</button>
  <button class="pill" data-cat="khoi_thpt">Khối THPT</button>
</div>

<div class="search-box">
  <input type="text" id="search-input" placeholder="Tìm kiếm bài viết..." />
</div>

<main id="main-content">
  <div class="state">
    <div class="spinner"></div>
    <p>Đang tải bài viết...</p>
  </div>
</main>

<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/cms-service.js"></script>
<script>
let currentCategory = '';
let currentSearch = '';

async function loadPosts() {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="state"><div class="spinner"></div><p>Đang tải...</p></div>`;

  try {
    const posts = await window.CMS.listPublishedPosts({
      limit: 50,
      category: currentCategory || null,
      search: currentSearch || null
    });

    if (!posts.length) {
      main.innerHTML = `
        <div class="state">
          <div class="icon">📝</div>
          <h2>Chưa có bài viết nào</h2>
          <p>${currentSearch ? 'Thử tìm với từ khoá khác' : 'Hãy quay lại sau nhé!'}</p>
        </div>`;
      return;
    }

    main.className = 'grid';
    main.innerHTML = posts.map(p => {
      const cover = p.cover_image
        ? `<img src="${p.cover_image}" alt="${escapeHtml(p.title)}">`
        : `<div style="width:100%;height:100%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;">📰</div>`;
      const author = p.author?.full_name || 'Ban biên tập';
      const date = window.CMS.formatDate(p.published_at || p.created_at);
      const cat = window.CMS.categoryLabel(p.category);
      return `
        <article class="card" onclick="window.location='news-detail.html?slug=${encodeURIComponent(p.slug)}'">
          <div class="card-cover">
            <span class="badge">${cat}</span>
            ${cover}
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span>👤 ${escapeHtml(author)}</span>
              <span>•</span>
              <span>📅 ${date}</span>
              <span>•</span>
              <span>👁️ ${p.views_count || 0}</span>
            </div>
            <h3 class="card-title">${escapeHtml(p.title)}</h3>
            <p class="card-summary">${escapeHtml(p.summary || '')}</p>
          </div>
        </article>`;
    }).join('');
  } catch (err) {
    console.error(err);
    main.innerHTML = `
      <div class="state">
        <div class="icon">⚠️</div>
        <h2>Không thể tải bài viết</h2>
        <p>${escapeHtml(err.message)}</p>
      </div>`;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

// Pill clicks
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentCategory = p.dataset.cat;
    loadPosts();
  });
});

// Search
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value.trim();
    loadPosts();
  }, 400);
});

// Init
async function init() {
  await window.getSupabase();
  // Check URL params
  const params = new URLSearchParams(location.search);
  if (params.get('cat')) currentCategory = params.get('cat');
  if (params.get('q')) currentSearch = params.get('q');
  if (currentCategory) {
    document.querySelectorAll('.pill').forEach(p => {
      p.classList.toggle('active', p.dataset.cat === currentCategory);
    });
  }
  if (currentSearch) {
    document.getElementById('search-input').value = currentSearch;
  }
  await loadPosts();
}
init();
</script>

</body>
</html>
