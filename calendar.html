<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lịch tuyển sinh 2026 – BrightWay</title>
<meta name="description" content="Lịch thi, nộp hồ sơ, công bố điểm chuẩn 2026 theo dòng thời gian." />
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg: linear-gradient(145deg, #e8eeff 0%, #dde8ff 20%, #e5deff 50%, #d6e9ff 80%, #e0f0ff 100%);
  --grad: linear-gradient(135deg,#5b7cfa 0%,#7c5bf5 50%,#9f5bea 100%);
  --grad-btn: linear-gradient(135deg,#6b8eff 0%,#8b6bff 100%);
  --text-dark: #1a1a3e;
  --text-mid: #3a3a6e;
  --text-soft: #6b7aaa;
  --accent: #6366f1;
  --shadow: 0 8px 32px rgba(99,102,241,0.15);
  --shadow-sm: 0 2px 10px rgba(99,102,241,0.08);
  --font: 'Be Vietnam Pro', system-ui, sans-serif;
  --font-display: 'Nunito', 'Be Vietnam Pro', sans-serif;
}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font);
  background:var(--bg);
  background-attachment:fixed;
  color:var(--text-dark);
  min-height:100vh;
  overflow-x:hidden;line-height:1.6;
}
body::before{
  content:'';position:fixed;top:-15%;left:-10%;width:55vw;height:55vw;
  background:radial-gradient(circle,rgba(130,100,255,0.18),transparent 65%);
  border-radius:50%;pointer-events:none;z-index:0;
  animation:blobFloat 14s ease-in-out infinite;
}
body::after{
  content:'';position:fixed;bottom:-15%;right:-10%;width:50vw;height:50vw;
  background:radial-gradient(circle,rgba(99,165,255,0.16),transparent 65%);
  border-radius:50%;pointer-events:none;z-index:0;
  animation:blobFloat 18s ease-in-out infinite reverse;
}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-3%) scale(1.04)}}

/* ── NAV ── */
.lp-nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.9);
  box-shadow:0 2px 20px rgba(99,102,241,0.08);
}
.lp-nav-inner{
  max-width:1200px;margin:0 auto;padding:0 24px;
  height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.lp-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.lp-logo-emoji{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--grad);font-size:18px;
  box-shadow:0 4px 14px rgba(99,102,241,0.3);
}
.lp-logo-text{font-family:var(--font-display);font-weight:900;font-size:1rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
.lp-nav-links{display:flex;align-items:center;gap:22px;}
.lp-nav-links a{font-size:.85rem;font-weight:600;color:var(--text-mid);text-decoration:none;transition:color .2s;}
.lp-nav-links a:hover{color:var(--accent);}
.lp-nav-cta{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--grad-btn);color:#fff;font-weight:700;font-size:.85rem;
  padding:8px 18px;border-radius:999px;border:none;cursor:pointer;
  box-shadow:0 6px 18px rgba(99,102,241,0.35);
  transition:transform .2s;white-space:nowrap;text-decoration:none;
}
.lp-nav-cta:hover{transform:translateY(-2px);}
@media(max-width:768px){.lp-nav-links{display:none;}}

/* ── HERO ── */
.cal-hero{
  padding:36px 24px 12px;text-align:center;position:relative;z-index:1;max-width:800px;margin:0 auto;
}
.cal-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.22);
  color:var(--accent);font-weight:700;font-size:.74rem;
  padding:4px 12px;border-radius:999px;margin-bottom:12px;letter-spacing:.04em;
}
.cal-hero h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.2;
  color:var(--text-dark);margin-bottom:10px;
}
.cal-hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.cal-hero-sub{font-size:.9rem;color:var(--text-soft);line-height:1.6;max-width:580px;margin:0 auto;}

/* ── COUNTDOWN ── */
.cal-countdown{
  background:linear-gradient(135deg,rgba(99,102,241,0.05),rgba(139,92,246,0.05));
  border:1.5px solid rgba(99,102,241,0.18);
  border-radius:16px;padding:14px 18px;
  margin:20px auto 0;max-width:800px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:relative;z-index:1;
}
.cal-countdown-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;background:var(--grad);color:#fff;flex-shrink:0;
}
.cal-countdown-body{flex:1;min-width:160px;}
.cal-countdown-label{
  font-size:.65rem;font-weight:700;text-transform:uppercase;
  color:var(--accent);letter-spacing:.08em;margin-bottom:2px;
}
.cal-countdown-title{
  font-family:var(--font-display);font-weight:800;font-size:.95rem;
  color:var(--text-dark);
}
.cal-countdown-date{font-size:.72rem;color:var(--text-soft);}
.cal-countdown-timer{display:flex;gap:6px;}
.cd-unit{
  background:#fff;border:1.5px solid rgba(99,102,241,0.2);
  border-radius:8px;padding:5px 8px;text-align:center;min-width:46px;
}
.cd-unit-num{
  font-family:var(--font-display);font-weight:900;font-size:1.1rem;
  color:var(--accent);line-height:1;display:block;
}
.cd-unit-label{
  font-size:.58rem;font-weight:700;color:var(--text-soft);
  text-transform:uppercase;letter-spacing:.04em;margin-top:2px;
}

/* ── QUICK JUMP ── */
.cal-jump{
  display:flex;flex-wrap:wrap;gap:6px;
  margin:18px auto 0;max-width:800px;padding:0 24px;
  position:relative;z-index:1;justify-content:center;
}
.cal-jump a{
  font-size:.74rem;font-weight:700;color:var(--text-mid);
  background:rgba(255,255,255,0.7);
  border:1.5px solid rgba(255,255,255,0.9);
  padding:5px 12px;border-radius:999px;text-decoration:none;
  transition:all .2s;
}
.cal-jump a:hover{background:#fff;color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm);}

/* ── GRID 12 THÁNG ── */
.cal-container{
  max-width:1100px;margin:0 auto;padding:24px 24px 48px;position:relative;z-index:1;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
}
@media(max-width:900px){.cal-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.cal-grid{grid-template-columns:1fr;}}

.cal-month{
  background:rgba(255,255,255,0.72);
  border:1.5px solid rgba(255,255,255,0.9);
  border-radius:14px;padding:12px 14px;
  backdrop-filter:blur(10px);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:8px;
  transition:transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
  scroll-margin-top:80px;
}
.cal-month:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.cal-month::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--grad);
}
.cal-month.is-current{
  border-color:var(--accent);
  box-shadow:0 4px 18px rgba(99,102,241,0.22);
}
.cal-month.is-current::before{
  background:linear-gradient(90deg,#ef4444,#f59e0b);
  height:4px;
}
.cal-month-hd{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:6px;border-bottom:1.5px dashed rgba(99,102,241,0.18);
}
.cal-month-name{
  font-family:var(--font-display);font-weight:800;font-size:.95rem;
  color:var(--text-dark);display:flex;align-items:center;gap:6px;
}
.cal-month-badge{
  font-size:.58rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ef4444,#f59e0b);
  padding:1px 6px;border-radius:999px;letter-spacing:.04em;
}
.cal-month-year{font-size:.7rem;font-weight:700;color:var(--text-soft);}
.cal-events{display:flex;flex-direction:column;gap:5px;}

.cal-event{
  display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;
  padding:6px 8px;border-radius:8px;
  background:rgba(255,255,255,0.55);
  border-left:2.5px solid var(--cat,var(--accent));
  transition:background .15s;
}
.cal-event:hover{background:#fff;}
.cal-event-date{
  font-family:var(--font-display);font-weight:800;
  color:var(--cat,var(--accent));line-height:1.1;text-align:center;
}
.cal-event-date .day{display:block;font-size:1rem;}
.cal-event-date .month{
  display:block;font-size:.55rem;text-transform:uppercase;
  letter-spacing:.04em;color:var(--text-soft);font-weight:700;margin-top:1px;
}
.cal-event-body{min-width:0;}
.cal-event-title{
  font-size:.78rem;font-weight:700;color:var(--text-dark);
  line-height:1.3;margin-bottom:1px;
}
.cal-event-sub{
  font-size:.68rem;color:var(--text-soft);line-height:1.4;
}
.cal-event-ico{margin-right:3px;}

.cal-empty{
  font-size:.72rem;color:var(--text-soft);text-align:center;padding:8px;
  font-style:italic;
}

/* ── FOOTER ── */
.lp-footer{
  position:relative;z-index:1;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.85);
  margin-top:12px;
}
.lp-footer-inner{
  max-width:1200px;margin:0 auto;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.lp-footer-logo{display:flex;align-items:center;gap:8px;}
.lp-footer-logo .emoji{width:28px;height:28px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:14px;}
.lp-footer-logo span{font-family:var(--font-display);font-weight:900;font-size:.85rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lp-footer-links{display:flex;gap:18px;flex-wrap:wrap;}
.lp-footer-links a{font-size:.8rem;color:var(--text-soft);text-decoration:none;font-weight:600;transition:color .2s;}
.lp-footer-links a:hover{color:var(--accent);}
</style>
</head>

<!-- GRID 12 THÁNG -->
<div class="cal-container">

</div>

<!-- FOOTER -->
<footer class="lp-footer">
  <div class="lp-footer-inner">
    <div class="lp-footer-logo">
      <div class="emoji">🎓</div>
      <span>BrightWay</span>
    </div>
    <div class="lp-footer-links">
      <a href="index.html">Trang chủ</a>
      <a href="page2.html">Trường</a>

  </div>
</footer>

  { d: '2026-09-25', cat: 'nop', title: 'Xét tuyển bổ sung đợt 2', sub: 'Nếu còn chỉ tiêu.' },

  { d: '2026-10-01', cat: 'cbt', title: 'Công bố điểm chuẩn bổ sung đợt 2', sub: 'Đợt cuối cùng công bố điểm chuẩn.' },
  { d: '2026-10-10', cat: 'tuvan', title: 'Mở ĐK xét tuyển sớm 2027', sub: 'Một số trường mở ĐK xét sớm cho năm sau.' },
  { d: '2026-10-15', cat: 'phong', title: 'PV học bổng tại các trường tư thục', sub: 'FPT, Duy Tân, RMIT… tổ chức PV.' },

  { d: '2026-11-05', cat: 'nop', title: 'Deadline nộp hồ sơ HB quốc tế', sub: 'Hết hạn nộp nhiều học bổng quốc tế.' },
  { d: '2026-11-15', cat: 'phong', title: 'Vòng PV học bổng chính phủ', sub: 'Chevening, Fulbright, MEXT… tổ chức PV.' },

  { d: '2026-12-01', cat: 'cbt', title: 'Công bố kết quả HB quốc tế đợt 1', sub: 'Nhiều CT học bổng công bố kết quả.' },
  { d: '2026-12-15', cat: 'tuvan', title: 'Tổng kết mùa tuyển sinh 2026', sub: 'Rút kinh nghiệm cho mùa sau.' },
];

const MONTHS = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6',
                'Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const MONTH_SHORT = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
const now = new Date();
const currentMonth = now.getFullYear() === 2026 ? now.getMonth() : -1;

// ── Quick jump bar ──
function renderJump() {
  const bar = document.getElementById('jumpBar');
  bar.innerHTML = MONTHS.map((m, i) =>
    `<a href="#m${i+1}">${m}</a>`
  ).join('');
}

// ── Grid 12 tháng ──
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let m = 0; m < 12; m++) {
    const evs = EVENTS.filter(e => new Date(e.d).getMonth() === m)
                      .sort((a,b) => new Date(a.d) - new Date(b.d));
    const isCurrent = m === currentMonth;
    const card = document.createElement('div');
    card.className = 'cal-month' + (isCurrent ? ' is-current' : '');
    card.id = 'm' + (m+1);
    card.innerHTML = `
      <div class="cal-month-hd">
        <div class="cal-month-name">
          ${MONTHS[m]}
          ${isCurrent ? '<span class="cal-month-badge">HIỆN TẠI</span>' : ''}
        </div>
        <span class="cal-month-year">2026</span>
      </div>
      <div class="cal-events">
        ${evs.length === 0
          ? '<div class="cal-empty">Chưa có sự kiện</div>'
          : evs.map(e => {
              const d = new Date(e.d);
              const c = CAT[e.cat];
              return `
                <div class="cal-event" style="--cat:${c.color}">
                  <div class="cal-event-date">
                    <span class="day">${d.getDate()}</span>
                    <span class="month">${MONTH_SHORT[d.getMonth()]}</span>
                  </div>
                  <div class="cal-event-body">
                    <div class="cal-event-title">
                      <span class="cal-event-ico">${c.icon}</span>${e.title}
                    </div>
                    <div class="cal-event-sub">${e.sub}</div>
                  </div>
                </div>
              `;
            }).join('')
        }
      </div>
    `;
    grid.appendChild(card);
  }
}

// ── Countdown ──
function updateCountdown() {
  const upcoming = EVENTS
    .map(e => ({...e, dt: new Date(e.d)}))
    .filter(e => e.dt >= now)
    .sort((a,b) => a.dt - b.dt);
  if (!upcoming.length) {
    document.getElementById('cdTitle').textContent = 'Hết sự kiện năm 2026';
    document.getElementById('cdDate').textContent = 'Hẹn gặp ở mùa 2027!';
    return;
  }
  const next = upcoming[0];
  const c = CAT[next.cat];
  document.getElementById('cdTitle').textContent = `${c.icon} ${next.title}`;
  const d = next.dt.getDate();
  const ms = MONTH_SHORT[next.dt.getMonth()];
  document.getElementById('cdDate').textContent = `📅 ${d} ${ms} 2026`;

  const diff = next.dt - now;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  document.getElementById('cdDays').textContent  = String(days).padStart(2,'0');
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent  = String(mins).padStart(2,'0');
}

// Init
renderJump();
renderGrid();
updateCountdown();
setInterval(updateCountdown, 60000);
</script>
