<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viết bài – BrightWay Admin</title>
<link rel="icon" type="image/png" href="/favicon.png?v=20261015">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_layout.css?v=20261020-admin-avatar">
<link rel="stylesheet" href="/assets/css/brightway-theme.css?v=7">
</head>
<body>

<button class="mobile-toggle" onclick="Admin.toggleSidebar()">☰</button>

<aside class="sidebar" id="sidebar">
  <div id="sidebar-content"></div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title" id="page-title">✍️ Viết bài mới</h1>
      <p class="page-subtitle">Soạn bài viết hướng nghiệp với Markdown</p>
    </div>
    <div class="page-actions">
      <a href="posts.html?type=post" class="btn btn-secondary">← Quay lại</a>
      <button class="btn btn-secondary" onclick="savePost('draft')">💾 Lưu nháp</button>
      <button class="btn btn-primary" onclick="savePost('published')">🚀 Đăng bài</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Tiêu đề <span class="required">*</span></label>
        <input type="text" id="title" class="form-input" placeholder="VD: 10 ngành nghề hot nhất 2026" required>
      </div>
      <div class="form-group">
        <label class="form-label">Slug (URL)</label>
        <input type="text" id="slug" class="form-input" placeholder="tu-dong-tao-tu-tieu-de">
        <div class="form-help">Để trống sẽ tự động tạo từ tiêu đề</div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Danh mục <span class="required">*</span></label>
        <select id="category" class="form-select">
          <option value="chia_se">Chia sẻ</option>
          <option value="tu_van">Tư vấn</option>
          <option value="su_kien">Sự kiện</option>
          <option value="khoi_thpt">Khối THPT</option>
          <option value="nganh_hoc">Ngành học</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ảnh bìa</label>
        <div class="upload-row">
          <input type="url" id="cover_image" class="form-input" placeholder="Dán URL hoặc tải ảnh lên">
          <label class="btn btn-secondary upload-button" id="cover-upload-button">🖼️ Tải ảnh
            <input type="file" id="cover_upload" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Tải ảnh bìa lên">
          </label>
        </div>
        <span class="upload-status" id="cover_upload_status">JPG, PNG, WEBP hoặc GIF · tối đa 8 MB</span>
        <img class="cover-preview" id="cover_preview" alt="Xem trước ảnh bìa">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tóm tắt</label>
      <textarea id="summary" class="form-textarea" rows="2" placeholder="Mô tả ngắn gọn về bài viết (hiển thị trong danh sách)"></textarea>
    </div>
  </div>

  <div class="editor-grid">
    <div class="editor-pane">
      <div class="editor-pane-header" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <span>✏️ Nội dung Markdown</span>
        <span style="display:flex;gap:6px;">
          <label class="btn btn-ghost upload-button" id="inline-image-button" style="padding:5px 8px;text-transform:none;letter-spacing:0;">+ Ảnh
            <input type="file" id="inline_image_upload" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Tải ảnh và chèn vào bài viết">
          </label>
          <label class="btn btn-ghost upload-button" id="inline-file-button" style="padding:5px 8px;text-transform:none;letter-spacing:0;">+ Tệp
            <input type="file" id="inline_file_upload" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" aria-label="Tải tệp và chèn vào bài viết">
          </label>
        </span>
      </div>
      <span class="upload-status" id="inline_upload_status" style="padding:0 16px;"></span>
      <textarea id="content" class="editor-textarea" placeholder="# Tiêu đề chính

Viết nội dung bằng **Markdown**...

## Mục con

- Danh sách
- Mục khác

> Trích dẫn

\`code\`"></textarea>
    </div>
    <div class="editor-pane">
      <div class="editor-pane-header">👁️ Xem trước</div>
      <div id="preview" class="editor-preview">
        <p style="color:var(--text-soft);">Bắt đầu viết để xem trước...</p>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end;">
    <a href="posts.html?type=post" class="btn btn-secondary">Hủy</a>
    <button class="btn btn-secondary" onclick="savePost('draft')">💾 Lưu nháp</button>
    <button class="btn btn-primary" onclick="savePost('published')">🚀 Đăng bài</button>
  </div>
</main>

<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/cms-service.js"></script>
<script src="_guard.js?v=20261020-admin-avatar"></script>
<script src="../assets/js/admin-upload.js"></script>
<script>
let currentPostId = null;

(async function () {
  const profile = await Admin.requireAdmin();
  if (!profile) return;
  document.getElementById('sidebar-content').innerHTML = Admin.buildSidebar('posts', profile);

  // Check URL param
  const params = new URLSearchParams(location.search);
  currentPostId = params.get('id');

  if (currentPostId) {
    await loadPost(currentPostId);
  } else {
    setupListeners();
  }
})();

async function loadPost(id) {
  try {
    const sb = window.supabaseClient;
    const { data, error } = await sb.from('posts').select('*').eq('id', id).single();
    if (error) throw error;
    if (!data) throw new Error('Không tìm thấy bài viết');

    document.getElementById('page-title').textContent = '✏️ Sửa bài viết';
    document.getElementById('title').value = data.title || '';
    document.getElementById('slug').value = data.slug || '';
    document.getElementById('category').value = data.category || 'chia_se';
    document.getElementById('cover_image').value = data.cover_image || '';
    document.getElementById('summary').value = data.summary || '';
    document.getElementById('content').value = data.content || '';

    setupListeners();
    updatePreview();
  } catch (err) {
    Admin.showToast('Lỗi: ' + err.message, 'error');
    setTimeout(() => location.href = 'posts.html?type=post', 1500);
  }
}

function setupListeners() {
  // Auto-slug từ title
  const titleEl = document.getElementById('title');
  const slugEl = document.getElementById('slug');
  let slugTouched = false;
  slugEl.addEventListener('input', () => slugTouched = true);
  titleEl.addEventListener('input', () => {
    if (!slugTouched && !currentPostId) {
      slugEl.value = window.CMS.slugify(titleEl.value);
    }
    updatePreview();
  });

  document.getElementById('content').addEventListener('input', updatePreview);
  document.getElementById('summary').addEventListener('input', updatePreview);
  const coverInput = document.getElementById('cover_image');
  coverInput.addEventListener('input', updateCoverPreview);
  updateCoverPreview();

  AdminUpload.bind({
    input: '#cover_upload', target: '#cover_image', status: '#cover_upload_status',
    button: '#cover-upload-button', kind: 'image'
  });
  bindInlineUpload('#inline_image_upload', 'image', '#inline-image-button');
  bindInlineUpload('#inline_file_upload', 'document', '#inline-file-button');
}

function updateCoverPreview() {
  const preview = document.getElementById('cover_preview');
  const url = document.getElementById('cover_image').value.trim();
  preview.onerror = () => preview.removeAttribute('src');
  if (url) preview.src = url;
  else preview.removeAttribute('src');
}

function bindInlineUpload(selector, kind, button) {
  const input = document.querySelector(selector);
  const status = document.getElementById('inline_upload_status');
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    if (!file) return;
    input.disabled = true;
    document.querySelector(button).style.opacity = '.55';
    status.dataset.state = 'loading';
    status.textContent = 'Đang tải lên…';
    try {
      const result = await AdminUpload.upload(file, kind);
      const label = result.name.replace(/[\[\]]/g, '');
      const markdown = kind === 'image' ? `![${label}](${result.url})` : `[📎 ${label}](${result.url})`;
      const editor = document.getElementById('content');
      const start = editor.selectionStart;
      const before = editor.value.slice(0, start);
      const after = editor.value.slice(editor.selectionEnd);
      const prefix = before && !before.endsWith('\n') ? '\n\n' : '';
      const suffix = after && !after.startsWith('\n') ? '\n\n' : '';
      editor.value = before + prefix + markdown + suffix + after;
      const caret = (before + prefix + markdown).length;
      editor.setSelectionRange(caret, caret);
      editor.focus();
      updatePreview();
      status.dataset.state = 'success';
      status.textContent = `✓ Đã chèn ${result.name}`;
      Admin.showToast('Đã tải và chèn vào bài viết', 'success');
    } catch (error) {
      status.dataset.state = 'error';
      status.textContent = error.message;
      Admin.showToast('Không thể tải lên: ' + error.message, 'error');
    } finally {
      input.disabled = false;
      document.querySelector(button).style.opacity = '';
      input.value = '';
    }
  });
}

function updatePreview() {
  const md = document.getElementById('content').value;
  const preview = document.getElementById('preview');
  if (!md.trim()) {
    preview.innerHTML = '<p style="color:var(--text-soft);">Bắt đầu viết để xem trước...</p>';
    return;
  }
  preview.innerHTML = renderMarkdown(md);
}

function renderMarkdown(md) {
  if (!md) return '';
  let html = Admin.escapeHtml(md);
  html = html.replace(/^######\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^#####\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^####\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  html = html.replace(/!\[(.*?)\]\((.+?)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">');
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*?<\/li>\n?)+/gs, m => '<ul>' + m + '</ul>');
  html = html.split(/\n\n+/).map(p => {
    if (p.match(/^<(h\d|ul|ol|blockquote|img)/)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}

async function savePost(status) {
  const title = document.getElementById('title').value.trim();
  if (!title) {
    Admin.showToast('Vui lòng nhập tiêu đề', 'warn');
    return;
  }
  let slug = document.getElementById('slug').value.trim();
  if (!slug) slug = window.CMS.slugify(title);

  const payload = {
    title,
    slug,
    category: document.getElementById('category').value,
    cover_image: document.getElementById('cover_image').value.trim() || null,
    summary: document.getElementById('summary').value.trim(),
    content: document.getElementById('content').value,
    status
  };

  try {
    if (currentPostId) {
      await window.CMS.updatePost(currentPostId, payload);
      Admin.showToast('Đã cập nhật bài viết', 'success');
    } else {
      const created = await window.CMS.createPost(payload);
      currentPostId = created.id;
      Admin.showToast('Đã tạo bài viết', 'success');
    }
    setTimeout(() => location.href = 'posts.html?type=post', 800);
  } catch (err) {
    Admin.showToast('Lỗi: ' + err.message, 'error');
  }
}
</script>

</body>
</html>
