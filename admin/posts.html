<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý nội dung – BrightWay Admin</title>
<link rel="icon" type="image/png" href="/favicon.png?v=20261015">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_layout.css">
<style>
  .content-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--border)}
  .content-toolbar input,.content-toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font:inherit}
  .content-toolbar input{flex:1;min-width:220px}.type-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .kind-badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.table td{vertical-align:middle}
  @media(max-width:760px){.content-toolbar>*{width:100%}.content-toolbar input{min-width:0}.page-actions{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="/assets/css/brightway-theme.css?v=5">
</head>
<body>
<button class="mobile-toggle" onclick="Admin.toggleSidebar()">☰</button>
<aside class="sidebar" id="sidebar"><div id="sidebar-content"></div></aside>
<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Quản lý nội dung</h1>
      <p class="page-subtitle">Bài viết và tài liệu trong cùng một nơi</p>
    </div>
    <div class="page-actions">
      <a href="post-edit.html" class="btn btn-primary">Viết bài</a>
      <a href="resource-edit.html" class="btn btn-secondary">Thêm tài liệu</a>
    </div>
  </div>
  <div class="card">
    <div class="content-toolbar">
      <div class="type-tabs" aria-label="Lọc loại nội dung">
        <button class="btn btn-ghost type-btn" data-type="all">Tất cả</button>
        <button class="btn btn-ghost type-btn" data-type="post">Bài viết</button>
        <button class="btn btn-ghost type-btn" data-type="resource">Tài liệu</button>
      </div>
      <input id="content-search" type="search" placeholder="Tìm tiêu đề, mô tả, nhà cung cấp..." aria-label="Tìm nội dung">
      <select id="status-filter">
        <option value="all">Tất cả trạng thái</option><option value="published">Đã đăng</option>
        <option value="draft">Bản nháp</option><option value="archived">Đã ẩn</option>
      </select>
      <select id="category-filter"><option value="">Tất cả danh mục</option></select>
      <span id="content-count" style="font-size:13px;color:var(--text-soft);white-space:nowrap"></span>
    </div>
    <div id="content-container"><div class="state"><div class="spinner"></div></div></div>
  </div>
</main>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/cms-service.js"></script>
<script src="_guard.js"></script>
<script>
let allContent = [];
let currentType = new URLSearchParams(location.search).get('type') || 'all';
if (!['all','post','resource'].includes(currentType)) currentType = 'all';

(async function init() {
  const profile = await Admin.requireAdmin();
  if (!profile) return;
  document.getElementById('sidebar-content').innerHTML = Admin.buildSidebar('posts', profile);
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === currentType);
    btn.addEventListener('click', () => {
      currentType = btn.dataset.type;
      history.replaceState(null, '', currentType === 'all' ? 'posts.html' : `posts.html?type=${currentType}`);
      document.querySelectorAll('.type-btn').forEach(item => item.classList.toggle('active', item === btn));
      renderContent();
    });
  });
  ['content-search','status-filter','category-filter'].forEach(id => {
    document.getElementById(id).addEventListener(id === 'content-search' ? 'input' : 'change', renderContent);
  });
  document.getElementById('content-container').addEventListener('click', handleAction);
  await loadContent();
})();

async function loadContent() {
  const container = document.getElementById('content-container');
  container.innerHTML = '<div class="state"><div class="spinner"></div></div>';
  try {
    const sb = window.supabaseClient;
    const [postsResult, resourcesResult] = await Promise.all([
      sb.from('posts').select('id,slug,title,summary,category,status,views_count,created_at').order('created_at',{ascending:false}),
      sb.from('resources').select('id,title,description,category,provider,url,is_published,views_count,created_at').order('created_at',{ascending:false})
    ]);
    if (postsResult.error) throw postsResult.error;
    if (resourcesResult.error) throw resourcesResult.error;
    allContent = [
      ...(postsResult.data || []).map(item => ({...item,kind:'post',description:item.summary || '',status:item.status || 'draft'})),
      ...(resourcesResult.data || []).map(item => ({...item,kind:'resource',description:item.description || '',status:item.is_published ? 'published' : 'draft'}))
    ].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    fillCategories();
    renderContent();
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="state"><div class="state-icon">⚠️</div><div class="state-desc">${Admin.escapeHtml(error.message)}</div></div>`;
  }
}

function fillCategories() {
  const select = document.getElementById('category-filter');
  const selected = select.value;
  const categories = [...new Set(allContent.map(item => item.category).filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b),'vi'));
  select.innerHTML = '<option value="">Tất cả danh mục</option>' + categories.map(category => `<option value="${Admin.escapeHtml(category)}">${Admin.escapeHtml(category.replaceAll('_',' '))}</option>`).join('');
  select.value = selected;
}

function renderContent() {
  const keyword = document.getElementById('content-search').value.trim().toLocaleLowerCase('vi');
  const status = document.getElementById('status-filter').value;
  const category = document.getElementById('category-filter').value;
  const list = allContent.filter(item => {
    if (currentType !== 'all' && item.kind !== currentType) return false;
    if (status !== 'all' && item.status !== status) return false;
    if (category && item.category !== category) return false;
    const haystack = [item.title,item.description,item.provider,item.category].filter(Boolean).join(' ').toLocaleLowerCase('vi');
    return !keyword || haystack.includes(keyword);
  });
  document.getElementById('content-count').textContent = `${list.length}/${allContent.length} nội dung`;
  const container = document.getElementById('content-container');
  if (!list.length) {
    container.innerHTML = '<div class="state"><div class="state-icon">📭</div><div class="state-title">Không có nội dung phù hợp</div><div class="state-desc">Thử đổi bộ lọc hoặc tạo nội dung mới.</div></div>';
    return;
  }
  container.innerHTML = `<div class="table-wrapper"><table class="table"><thead><tr>
    <th>Loại</th><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Ngày tạo</th><th>Lượt xem</th><th style="text-align:right">Thao tác</th>
  </tr></thead><tbody>${list.map(item => `
    <tr><td><span class="badge badge-info kind-badge">${item.kind === 'post' ? '📝 Bài viết' : '📚 Tài liệu'}</span></td>
    <td><strong>${Admin.escapeHtml(item.title)}</strong>${item.description ? `<div style="font-size:12px;color:var(--text-soft);margin-top:4px;max-width:480px">${Admin.escapeHtml(item.description.slice(0,100))}${item.description.length>100?'…':''}</div>`:''}</td>
    <td>${item.kind === 'post' ? Admin.categoryBadge(item.category) : `<span class="badge">${Admin.escapeHtml(item.category || '—')}</span>`}</td>
    <td>${Admin.statusBadge(item.status)}</td><td>${Admin.formatDate(item.created_at)}</td><td>${item.views_count || 0}</td>
    <td><div class="table-actions" style="justify-content:flex-end">
      ${item.status === 'published' ? `<a class="btn btn-ghost" target="_blank" rel="noopener noreferrer" href="${item.kind === 'post' ? `../news-detail.html?slug=${encodeURIComponent(item.slug)}` : Admin.escapeHtml(item.url || '../resources.html')}" title="Xem">👁️</a>`:''}
      <a class="btn btn-ghost" href="${item.kind === 'post' ? 'post-edit.html' : 'resource-edit.html'}?id=${encodeURIComponent(item.id)}" title="Sửa">✏️</a>
      <button class="btn btn-ghost" data-action="toggle" data-kind="${item.kind}" data-id="${item.id}" data-status="${item.status}" title="${item.status === 'published' ? 'Ẩn' : 'Đăng'}">${item.status === 'published' ? '🔒' : '🚀'}</button>
      <button class="btn btn-ghost" style="color:var(--danger)" data-action="delete" data-kind="${item.kind}" data-id="${item.id}" title="Xóa">🗑️</button>
    </div></td></tr>`).join('')}</tbody></table></div>`;
}

async function handleAction(event) {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const item = allContent.find(row => row.kind === button.dataset.kind && String(row.id) === button.dataset.id);
  if (!item) return;
  if (button.dataset.action === 'delete') return deleteContent(item);
  return toggleContent(item);
}

async function toggleContent(item) {
  const publishing = item.status !== 'published';
  const label = item.kind === 'post' ? 'bài viết' : 'tài liệu';
  const ok = await Admin.confirmAction(`Bạn có chắc muốn ${publishing ? 'đăng' : 'ẩn'} ${label} này?`, `${publishing ? 'Đăng' : 'Ẩn'} ${label}`);
  if (!ok) return;
  try {
    if (item.kind === 'post') {
      const update = {status: publishing ? 'published' : 'archived'};
      if (publishing) update.published_at = new Date().toISOString();
      const {error} = await window.supabaseClient.from('posts').update(update).eq('id',item.id);
      if (error) throw error;
    } else {
      await CMS.updateResource(item.id,{is_published:publishing});
    }
    Admin.showToast(`Đã ${publishing ? 'đăng' : 'ẩn'} ${label}`,'success');
    await loadContent();
  } catch (error) { Admin.showToast('Lỗi: '+error.message,'error'); }
}

async function deleteContent(item) {
  const label = item.kind === 'post' ? 'bài viết' : 'tài liệu';
  const ok = await Admin.confirmAction(`Xóa vĩnh viễn ${label} “${item.title}”? Không thể hoàn tác.`,`Xóa ${label}`);
  if (!ok) return;
  try {
    if (item.kind === 'post') await CMS.deletePost(item.id); else await CMS.deleteResource(item.id);
    Admin.showToast(`Đã xóa ${label}`,'success');
    await loadContent();
  } catch (error) { Admin.showToast('Lỗi: '+error.message,'error'); }
}
</script>
</body>
</html>
