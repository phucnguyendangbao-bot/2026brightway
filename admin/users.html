<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý tài khoản – BrightWay Admin</title>
<link rel="icon" type="image/png" href="../images/img-a84652d05567.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_layout.css">
</head>
<body>

<button class="mobile-toggle" onclick="Admin.toggleSidebar()">☰</button>

<aside class="sidebar" id="sidebar">
  <div id="sidebar-content"></div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">👥 Quản lý tài khoản</h1>
      <p class="page-subtitle">Tạo tài khoản cho giáo viên/học sinh — chỉ cần email, không cần OTP</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" onclick="openCreateModal()">➕ Tạo tài khoản mới</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Danh sách tài khoản</div>
      <input type="text" id="searchBox" class="form-input" placeholder="🔍 Tìm theo email/tên..." style="max-width:240px;">
    </div>
    <div id="users-container">
      <div class="state"><div class="spinner"></div><p style="margin-top:16px;">Đang tải...</p></div>
    </div>
  </div>
</main>

<!-- Modal tạo user -->
<div id="createBackdrop" class="modal-backdrop" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <div class="modal-title">➕ Tạo tài khoản mới</div>
    <div class="modal-desc">User sẽ đăng nhập được ngay bằng email (không cần OTP, không cần verify).</div>

    <div class="form-group">
      <label class="form-label">Email <span class="required">*</span></label>
      <input type="email" id="newEmail" class="form-input" placeholder="gv1@truong.edu.vn" required>
    </div>

    <div class="form-group">
      <label class="form-label">Họ và tên</label>
      <input type="text" id="newName" class="form-input" placeholder="Nguyễn Văn A">
    </div>

    <div class="form-group">
      <label class="form-label">Vai trò</label>
      <select id="newRole" class="form-select">
        <option value="student">Học sinh</option>
        <option value="teacher">Giáo viên</option>
        <option value="admin">Quản trị viên</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCreateModal()">Hủy</button>
      <button class="btn btn-primary" onclick="createUser()">➕ Tạo tài khoản</button>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/cms-service.js"></script>
<script src="_guard.js"></script>
<script>
let allUsers = [];

(async function () {
  const profile = await Admin.requireAdmin();
  if (!profile) return;
  document.getElementById('sidebar-content').innerHTML = Admin.buildSidebar('users', profile);

  document.getElementById('searchBox').addEventListener('input', renderUsers);
  await loadUsers();
})();

async function loadUsers() {
  const container = document.getElementById('users-container');
  try {
    const sb = window.supabaseClient;
    const { data, error } = await sb
      .from('profiles')
      .select('id, full_name, role, created_at, updated_at')
      .order('created_at', { ascending: false });
    if (error) throw error;
    allUsers = data || [];
    renderUsers();
  } catch (err) {
    container.innerHTML = `<div class="state"><div class="state-icon">⚠️</div><div class="state-desc">${Admin.escapeHtml(err.message)}</div></div>`;
  }
}

function renderUsers() {
  const container = document.getElementById('users-container');
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  const filtered = allUsers.filter(u =>
    !q ||
    (u.full_name || '').toLowerCase().includes(q) ||
    u.role.toLowerCase().includes(q)
  );

  if (!filtered.length) {
    container.innerHTML = `<div class="state"><div class="state-icon">👥</div><div class="state-title">Chưa có tài khoản</div><div class="state-desc">Bấm "Tạo tài khoản mới" để bắt đầu</div></div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr><th>Họ tên</th><th>Vai trò</th><th>Ngày tạo</th><th style="text-align:right;">Thao tác</th></tr>
        </thead>
        <tbody>
          ${filtered.map(u => `
            <tr>
              <td>
                <strong>${Admin.escapeHtml(u.full_name || '—')}</strong>
                <div style="color:var(--text-soft);font-size:13px;">${Admin.escapeHtml(u.id)}</div>
              </td>
              <td>${roleBadge(u.role)}</td>
              <td>${Admin.formatDate(u.created_at)}</td>
              <td>
                <div class="table-actions" style="justify-content:flex-end;">
                  <select onchange="changeRole('${u.id}', this.value)" class="form-select" style="padding:6px 10px;font-size:13px;">
                    <option value="student" ${u.role==='student'?'selected':''}>HS</option>
                    <option value="teacher" ${u.role==='teacher'?'selected':''}>GV</option>
                    <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                  </select>
                  <button class="btn btn-ghost" style="color:var(--danger);" onclick="deleteUser('${u.id}', '${Admin.escapeHtml(u.full_name||'')}')">🗑️</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function roleBadge(role) {
  const map = {
    admin: '<span class="badge badge-danger">Admin</span>',
    teacher: '<span class="badge badge-success">Giáo viên</span>',
    student: '<span class="badge badge-info">Học sinh</span>'
  };
  return map[role] || role;
}

function openCreateModal() {
  document.getElementById('createBackdrop').style.display = 'flex';
  document.getElementById('newEmail').focus();
}
function closeCreateModal() {
  document.getElementById('createBackdrop').style.display = 'none';
  document.getElementById('newEmail').value = '';
  document.getElementById('newName').value = '';
}

async function createUser() {
  const email = document.getElementById('newEmail').value.trim();
  const name = document.getElementById('newName').value.trim();
  const role = document.getElementById('newRole').value;

  if (!email || !email.includes('@')) {
    Admin.showToast('Vui lòng nhập email hợp lệ', 'warn');
    return;
  }

  try {
    const sb = window.supabaseClient;
    const { data, error } = await sb.rpc('admin_create_user', {
      email_input: email,
      full_name_input: name,
      role_input: role
    });
    if (error) throw error;

    Admin.showToast(`Đã tạo tài khoản ${email}`, 'success');
    closeCreateModal();
    await loadUsers();
  } catch (err) {
    Admin.showToast('Lỗi: ' + err.message, 'error');
  }
}

async function changeRole(userId, newRole) {
  try {
    const sb = window.supabaseClient;
    const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', userId);
    if (error) throw error;
    Admin.showToast(`Đã đổi vai trò → ${newRole}`, 'success');
    await loadUsers();
  } catch (err) {
    Admin.showToast('Lỗi: ' + err.message, 'error');
  }
}

async function deleteUser(userId, name) {
  const ok = await Admin.confirmAction(`Xoá tài khoản "${name || userId}"?`, 'Xoá tài khoản');
  if (!ok) return;
  try {
    const sb = window.supabaseClient;
    // Xoá profile trước (không thể xoá auth.users qua anon key)
    const { error } = await sb.from('profiles').delete().eq('id', userId);
    if (error) throw error;
    Admin.showToast('Đã xoá profile (auth.user vẫn còn trong DB)', 'success');
    await loadUsers();
  } catch (err) {
    Admin.showToast('Lỗi: ' + err.message, 'error');
  }
}
</script>

</body>
</html>
