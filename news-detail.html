<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chi tiết bài viết – BrightWay Career</title>
<link rel="icon" type="image/png" href="images/img-a84652d05567.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg: linear-gradient(145deg, #e8eeff 0%, #dde8ff 20%, #e5deff 50%, #d6e9ff 80%, #e0f0ff 100%);
  --glass: rgba(255,255,255,0.62);
  --glass-border: rgba(255,255,255,0.85);
  --grad: linear-gradient(135deg,#5b7cfa 0%,#7c5bf5 50%,#9f5bea 100%);
  --text-dark: #1a1a3e;
  --text-mid: #3a3a6e;
  --text-soft: #6b7aaa;
  --accent: #6366f1;
  --white: #ffffff;
  --shadow: 0 8px 32px rgba(99,102,241,0.15);
  --font: 'Be Vietnam Pro', system-ui, sans-serif;
  --font-display: 'Nunito', sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text-dark);min-height:100vh;line-height:1.7;}
a{color:inherit;text-decoration:none;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:14px 24px;}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:24px;}
.nav-brand{font-family:var(--font-display);font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:20px;align-items:center;margin-left:auto;}
.nav-links a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--text-mid);transition:0.2s;}
.nav-links a:hover{background:rgba(99,102,241,0.1);color:var(--accent);}

/* ARTICLE */
.article{max-width:800px;margin:0 auto;padding:48px 24px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;margin-bottom:24px;cursor:pointer;}
.back-btn:hover{transform:translateX(-4px);transition:0.2s;}

.cover{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#c7d2fe,#e0e7ff);margin-bottom:32px;box-shadow:var(--shadow);}
.cover img{width:100%;height:100%;object-fit:cover;}

.badge{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(99,102,241,0.1);color:var(--accent);font-size:13px;font-weight:700;margin-bottom:16px;}

h1.title{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:1.2;margin-bottom:20px;}

.meta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;border-top:1px solid rgba(99,102,241,0.1);border-bottom:1px solid rgba(99,102,241,0.1);margin-bottom:32px;color:var(--text-soft);font-size:14px;}
.author{display:flex;align-items:center;gap:10px;}
.author-avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}
.author-name{color:var(--text-dark);font-weight:600;}

.summary{font-size:18px;color:var(--text-mid);font-style:italic;margin-bottom:32px;padding:20px 24px;border-left:4px solid var(--accent);background:rgba(255,255,255,0.5);border-radius:0 12px 12px 0;}

.content{font-size:16px;color:var(--text-dark);}
.content p{margin-bottom:16px;}
.content h2{font-family:var(--font-display);font-weight:800;font-size:26px;margin:32px 0 16px;}
.content h3{font-family:var(--font-display);font-weight:700;font-size:22px;margin:24px 0 12px;color:var(--accent);}
.content ul, .content ol{margin:16px 0 16px 24px;}
.content li{margin-bottom:8px;}
.content img{max-width:100%;border-radius:12px;margin:16px 0;}
.content strong{color:var(--accent);}
.content blockquote{border-left:4px solid var(--grad);padding:12px 20px;margin:20px 0;background:rgba(99,102,241,0.05);border-radius:0 12px 12px 0;font-style:italic;}
.content code{background:rgba(99,102,241,0.1);padding:2px 8px;border-radius:6px;font-family:monospace;font-size:14px;color:var(--accent);}

.state{padding:80px 24px;text-align:center;}
.state .icon{font-size:64px;margin-bottom:16px;}
.state h2{font-family:var(--font-display);font-size:24px;margin-bottom:8px;}
.state p{color:var(--text-soft);margin-bottom:24px;}
.spinner{display:inline-block;width:40px;height:40px;border:4px solid rgba(99,102,241,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  .article{padding:24px 20px;}
  h1.title{font-size:26px;}
  .content{font-size:15px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">BrightWay Career</a>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="news.html">Tin tức</a>
      <a href="majors.html">Ngành nghề</a>
      <a href="holland.html">Trắc nghiệm</a>
    </div>
  </div>
</nav>

<article class="article" id="article-container">
  <div class="state">
    <div class="spinner"></div>
    <p>Đang tải bài viết...</p>
  </div>
</article>

<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/cms-service.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

// Simple markdown renderer (basic - bold, italic, h1-h6, ul, ol, code, blockquote, img)
function renderMarkdown(md) {
  if (!md) return '';
  let html = escapeHtml(md);
  // Headers
  html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h2>$1</h2>');
  // Bold/italic
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Code
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  // Images
  html = html.replace(/!\[(.*?)\]\((.+?)\)/g, '<img src="$2" alt="$1">');
  // Links
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Blockquote
  html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
  // Lists
  html = html.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*?<\/li>\n?)+/gs, m => '<ul>' + m + '</ul>');
  // Numbered
  html = html.replace(/^\d+\.\s+(.+)$/gm, '<oli>$1</oli>');
  html = html.replace(/(<oli>.*?<\/oli>\n?)+/gs, m => '<ol>' + m.replace(/<\/?oli>/g, m => m.replace('oli','li')) + '</ol>');
  // Paragraphs
  html = html.split(/\n\n+/).map(p => {
    if (p.match(/^<(h\d|ul|ol|blockquote|img)/)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return html;
}

async function load() {
  const container = document.getElementById('article-container');
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');

  if (!slug) {
    container.innerHTML = `
      <div class="state">
        <div class="icon">❌</div>
        <h2>Không tìm thấy bài viết</h2>
        <p>Liên kết không hợp lệ</p>
        <a href="news.html" class="back-btn">← Quay lại danh sách</a>
      </div>`;
    return;
  }

  try {
    await window.getSupabase();
    const post = await window.CMS.getPostBySlug(slug);

    const cover = post.cover_image
      ? `<div class="cover"><img src="${post.cover_image}" alt="${escapeHtml(post.title)}"></div>`
      : '';
    const author = post.author?.full_name || 'Ban biên tập';
    const initials = author.split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
    const date = window.CMS.formatDate(post.published_at || post.created_at);
    const cat = window.CMS.categoryLabel(post.category);
    const school = post.author?.school ? ` • ${escapeHtml(post.author.school)}` : '';

    container.innerHTML = `
      <a href="news.html" class="back-btn">← Quay lại danh sách</a>
      <span class="badge">${cat}</span>
      <h1 class="title">${escapeHtml(post.title)}</h1>
      <div class="meta">
        <div class="author">
          <div class="author-avatar">${initials}</div>
          <div>
            <div class="author-name">${escapeHtml(author)}</div>
            <div>${escapeHtml(post.author?.subject || '')}${school}</div>
          </div>
        </div>
        <span>📅 ${date}</span>
        <span>👁️ ${post.views_count || 0} lượt xem</span>
      </div>
      ${post.summary ? `<div class="summary">${escapeHtml(post.summary)}</div>` : ''}
      ${cover}
      <div class="content">${renderMarkdown(post.content)}</div>
    `;
    document.title = `${post.title} – BrightWay Career`;
  } catch (err) {
    console.error(err);
    container.innerHTML = `
      <div class="state">
        <div class="icon">⚠️</div>
        <h2>Không thể tải bài viết</h2>
        <p>${escapeHtml(err.message)}</p>
        <a href="news.html" class="back-btn">← Quay lại</a>
      </div>`;
  }
}
load();
</script>

</body>
</html>
